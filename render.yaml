# ══════════════════════════════════════════════════════════════
# Render Blueprint – Spraymate Backend
# ══════════════════════════════════════════════════════════════
# This file defines your infrastructure as code for Render.
# Commit it to your repo, then connect the repo in the Render
# dashboard → "Blueprints" to auto-provision everything.
# ══════════════════════════════════════════════════════════════

services:
  - type: web
    name: spraymate-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: spraymate-db
          property: connectionURI
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: OPENWEATHER_API_KEY
        sync: false   # Set this manually in the Render dashboard

databases:
  - name: spraymate-db
    plan: free
    databaseName: spraymate
    region: oregon
